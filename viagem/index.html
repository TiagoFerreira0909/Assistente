<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mapa da Viagem</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Viagem">
<meta name="theme-color" content="#f6f6f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
/* Mapa a ecrã inteiro e pouca interface por cima: cidade e filtros no topo, folha deslizante em baixo. */
:root{
  --bg:#f6f6f4; --glass:rgba(255,255,255,.86); --surface:#ffffff; --ink:#111;
  --muted:#8a8a86; --line:rgba(0,0,0,.07); --soft:#f1f1ef;
  --comer:#e0603b; --beber:#d39a1c; --ver:#2a8c8f; --fazer:#7458c4;
  --me:#2f6fed; --ok:#2e9a5b;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 4px 20px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e0f10; --glass:rgba(28,29,31,.86); --surface:#1c1d1f; --ink:#f2f2f0;
    --muted:#8d8e8c; --line:rgba(255,255,255,.08); --soft:#26272a; color-scheme:dark;
    --shadow:0 4px 20px rgba(0,0,0,.4) }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:9px;opacity:.6}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--peek,120px) - 4px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--shadow)}

/* Topo */
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(var(--safe-t) + 10px) 14px 0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.top > *{pointer-events:auto}
.toprow{display:flex;gap:8px;width:100%;align-items:center}
.cities{display:flex;border-radius:999px;padding:3px}
.cities button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.cities button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn.on{color:var(--me)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink)}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Botões do mapa */
.fabs{position:fixed;right:14px;z-index:5;display:flex;flex-direction:column;gap:10px;bottom:calc(var(--peek,120px) + 16px);transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
.fab{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.fab svg{width:20px;height:20px}
.fab.on{color:var(--me)}

/* Marcadores */
.mk{--s:44px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c) center/cover no-repeat;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);position:relative;transition:width .2s,height .2s;cursor:pointer;display:grid;place-items:center;color:#fff}
.mk::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff}
.mk.noimg::after{display:none}
.mk svg{width:45%;height:45%}
.mk.small{--s:30px}
.mk.small::after{width:9px;height:9px}
.mk.done{filter:grayscale(1);opacity:.55}
.mk.sel{--s:58px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.me{width:16px;height:16px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,111,237,.18),0 1px 4px rgba(0,0,0,.3)}

/* Folha */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -2px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;height:calc(var(--h,120px) + var(--safe-b));transition:height .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet.drag{transition:none}
.grab{padding:8px 20px 4px;touch-action:none;cursor:grab;flex:none}
.grab::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--muted);opacity:.35;margin:0 auto 12px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:6px}
.head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.head span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.list{padding:0 12px 20px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:14px}
.row:active{background:var(--soft)}
.th{flex:none;width:52px;height:52px;border-radius:12px;background:var(--c) center/cover no-repeat;display:grid;place-items:center;color:#fff}
.th svg{width:22px;height:22px}
.row .txt{flex:1;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dist{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .th{filter:grayscale(1);opacity:.5}
.row.done .nm{color:var(--muted)}
.tips{margin:0 8px 8px;font-size:13px;color:var(--muted)}
.tips summary{list-style:none;cursor:pointer;color:var(--ink);font-weight:600;padding:6px 0}
.tips summary::-webkit-details-marker{display:none}
.tips summary::after{content:" ›";color:var(--muted)}
.tips ul{margin:2px 0 6px;padding-left:16px;display:grid;gap:6px}
.empty{padding:28px 12px;color:var(--muted);text-align:center}

/* Detalhe */
.detail{padding:0 20px 24px}
.dtop{display:flex;gap:14px;align-items:center;margin:2px 0 14px}
.dtop .th{width:72px;height:72px;border-radius:16px}
.dtop .th svg{width:30px;height:30px}
.kicker{font-size:12px;font-weight:600;color:var(--c);letter-spacing:.02em}
.detail h3{margin:2px 0 0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
.detail p{margin:0 0 12px}
.tip{color:var(--muted);font-size:14px;border-left:2px solid var(--soft);padding-left:10px;margin:0 0 16px}
.actions{display:flex;gap:8px;margin-bottom:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;background:var(--soft);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ok{background:var(--ok);color:#fff}
.btn svg{width:17px;height:17px}
.vids{display:grid;gap:8px}
.vid{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px;background:var(--soft)}
.vid .play{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.vid .play svg{width:14px;height:14px;margin-left:2px}
.vid b{font-weight:600;font-size:14px}
.vid small{display:block;color:var(--muted);font-size:12px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-size:14px;font-weight:600;padding:2px 0 10px}
.link{display:block;width:100%;text-align:center;color:var(--muted);font-size:13px;padding:14px 0 0}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 18px calc(18px + var(--safe-b));max-height:94vh;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h4{margin:0;font-size:17px;font-weight:700}
.x{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.x svg{width:14px;height:14px}
.frame{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;max-height:70vh;border-radius:14px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,textarea{font:16px var(--font);padding:12px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);width:100%}
textarea{min-height:72px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.4}
.hint{font-size:13px;color:var(--muted);margin:0;font-weight:400}

/* Aviso de proximidade dentro da app */
.near{position:fixed;left:14px;right:14px;top:calc(var(--safe-t) + 10px);z-index:15;border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center;text-align:left;animation:drop .35s cubic-bezier(.2,.8,.2,1)}
.near .th{width:48px;height:48px}
.near b{display:block;font-size:14px}
.near span.t{font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(var(--peek,120px) + 20px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}
.picking .top,.picking .sheet,.picking .fabs{display:none}
.pickbar{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 16px);z-index:12;border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px}
.pickbar p{margin:0;flex:1;font-weight:600;font-size:14px}
.pickbar .btn{flex:none;padding:10px 14px}
.cross{position:fixed;left:50%;top:50%;z-index:11;pointer-events:none;transform:translate(-50%,-50%)}
@media (prefers-reduced-motion: reduce){.sheet,.fabs,.mk{transition:none}.near{animation:none}}

/* Horários e pôr do sol */
.sun{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding-bottom:8px;font-variant-numeric:tabular-nums}
.sun svg{width:16px;height:16px;flex:none}
.st{font-weight:600}
.st.open{color:var(--ok)} .st.soon{color:var(--beber)} .st.closed{color:var(--comer)}
.hours{font-size:14px;margin:-4px 0 10px}
.row .nm,.row .sub{display:block}

/* Diário e fotos */
.diary{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.diary h4{margin:0 0 8px;font-size:15px}
.diary textarea{min-height:64px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ph{aspect-ratio:1;border-radius:10px;background:var(--soft) center/cover no-repeat;position:relative;overflow:hidden}
.ph em{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:999px;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border:1.5px dashed var(--line)}
.ph.add svg{width:20px;height:20px}
img.big{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--soft)}

/* Mural */
.feed{display:grid;gap:22px;padding-bottom:10px}
.post header{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post header small{display:block;color:var(--muted);font-size:12px}
.post header b{font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.plc{color:var(--muted);font-size:14px;font-weight:500}
.post img{display:block;width:100%;border-radius:14px;background:var(--soft);aspect-ratio:4/5;object-fit:cover}
.post footer{display:flex;gap:10px;align-items:flex-start;padding-top:8px}
.post footer p{margin:3px 0 0;font-size:14px;flex:1}
.like{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:14px;flex:none;padding:2px 0}
.like svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.like.on{color:#e0485f}
.like.on svg{fill:currentColor}

/* Menu */
.menu{display:grid;gap:4px;padding-bottom:6px}
.mrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 4px;border-radius:12px}
.mrow:active{background:var(--soft)}
.mrow > svg{width:22px;height:22px;flex:none}
.mrow > span{flex:1;min-width:0}
.mrow b{display:block;font-weight:600}
.mrow small{display:block;color:var(--muted);font-size:13px}
.sw{width:44px;height:26px;border-radius:999px;background:var(--soft);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ok)} .sw.on::after{transform:translateX(18px)}
.bar{height:4px;border-radius:2px;background:var(--soft);margin:-4px 4px 6px 40px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.linkbox{padding:12px;border-radius:12px;background:var(--soft);font-size:13px;word-break:break-all;user-select:all;-webkit-user-select:all}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry-h{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.entry-h .th{width:44px;height:44px}
.entry-h small{display:block;color:var(--muted);font-size:12px}
.entry p{margin:8px 0 0;font-size:14px}
@media (prefers-reduced-motion: reduce){.sw,.sw::after,.bar i{transition:none}}

/* Extras da noite */
.psec{margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.psec small{font-weight:600;text-transform:none;letter-spacing:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;opacity:.6}
.badge svg{width:12px;height:12px}
.badge.on{background:var(--beber);color:#fff;opacity:1}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.stamp .sc{width:56px;height:56px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;color:var(--muted);opacity:.6}
.stamp .sc svg{width:24px;height:24px}
.stamp.on .sc{border:2px solid var(--comer);background:var(--comer);color:#fff;opacity:1;transform:rotate(-8deg)}
.stamp .sn{font-size:12px;font-weight:600;line-height:1.2}
.stars{display:inline-flex;gap:1px;flex:none}
.stars i svg{width:13px;height:13px;color:var(--soft);display:block}
.stars i.on svg{color:var(--beber)}
.gblock{margin-top:18px;padding:14px;border-radius:16px;background:var(--soft)}
.gblock h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px}
.gblock h4 svg{width:18px;height:18px}
.gblock h4 small{margin-left:auto;color:var(--muted);font-weight:600;font-size:13px}
.rate{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:14px}
.rstars{display:inline-flex;gap:2px}
.rstars button{width:30px;height:30px;display:grid;place-items:center;color:var(--line);color:color-mix(in srgb,var(--muted) 35%,transparent)}
.rstars button svg{width:22px;height:22px}
.rstars button.on{color:var(--beber)}
.rstars.big button{width:38px;height:38px}
.rstars.big button svg{width:28px;height:28px}
.rank{list-style:none;margin:0;padding:0 0 10px}
.rank button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.rank .pos{width:26px;font-weight:800;font-size:17px;color:var(--muted);flex:none}
.rank li:first-child .pos{color:var(--beber)}
.rank .rn{flex:1;min-width:0}
.rank .rn small{display:block;color:var(--muted);font-size:12px}
.rank .rv{font-weight:700;font-variant-numeric:tabular-nums;width:30px;text-align:right}
.wlist{display:grid;gap:10px}
.wcard{padding:12px;border-radius:14px;background:var(--soft)}
.wcard header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard small{color:var(--muted);font-size:12px}
.wcard p{margin:6px 0 0;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.chk input{width:auto}
.bingo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.bingo button{aspect-ratio:1;border-radius:12px;background:var(--soft);font-size:11px;font-weight:600;line-height:1.2;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;hyphens:auto;-webkit-hyphens:auto;overflow:hidden}
.bingo button.on{background:var(--comer);color:#fff}
.bingo.win{animation:win .6s}
@keyframes win{30%{transform:scale(1.04) rotate(-1deg)}60%{transform:scale(.98) rotate(1deg)}}
.bscore{margin-top:10px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.blist{list-style:none;padding:0;margin:0}
.blist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.blist span{color:var(--muted);font-variant-numeric:tabular-nums}
.homemk{--s:36px}
@media (max-width:360px){.bingo button{font-size:10px}}
@media (prefers-reduced-motion: reduce){.bingo.win{animation:none}}

/* Roleta */
.wheelbox{position:relative;width:min(290px,78vw);aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;border-radius:50%;position:relative;border:6px solid var(--ink);box-shadow:var(--shadow);
  background:conic-gradient(var(--ok) 0 45deg,var(--comer) 45deg 90deg,var(--ok) 90deg 135deg,var(--comer) 135deg 180deg,var(--ok) 180deg 225deg,var(--comer) 225deg 270deg,var(--ok) 270deg 315deg,var(--comer) 315deg 360deg);cursor:pointer}
.wl{position:absolute;left:50%;top:0;height:50%;width:0;transform-origin:50% 100%;display:flex;justify-content:center}
.wl b{margin-top:16%;color:#fff;font-size:17px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pointer{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.3);border:4px solid var(--ink)}
.wres{text-align:center;margin:18px 0 6px;min-height:52px}
.wres b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.wres b.sim{color:var(--ok)} .wres b.nao{color:var(--comer)}
.wres small{display:block;color:var(--muted);font-size:14px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.wres b{animation:none}}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="toprow">
    <div class="cities glass" role="group" aria-label="Cidade">
      <button data-city="edi" aria-pressed="true">Edimburgo</button>
      <button data-city="dub" aria-pressed="false">Dublin</button>
    </div>
    <button class="iconbtn glass" id="feed" aria-label="Mural de fotos" style="margin-left:auto"></button>
    <button class="iconbtn glass" id="menu" aria-label="Mais opções"></button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="fabs">
  <button class="fab glass" id="home" aria-label="Levar-me ao alojamento"></button>
  <button class="fab glass" id="add" aria-label="Adicionar sítio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="fab glass" id="locate" aria-label="A minha localização"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.9 3.1a.8.8 0 0 0-.9-.2L3.5 9.6a.8.8 0 0 0 .1 1.5l6.8 2.5 2.5 6.8a.8.8 0 0 0 1.5.1L21 4a.8.8 0 0 0-.1-.9z"/></svg></button>
</div>

<section class="sheet" id="sheet">
  <div class="grab" id="grab"><div id="head"><div class="head"><h2 id="title">Edimburgo</h2><span id="count"></span></div><div class="sun" id="sun"></div></div></div>
  <div class="scroll" id="scroll">
    <div class="list" id="list"></div>
    <div class="detail" id="detail" hidden></div>
  </div>
</section>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script src="places.js?v=12"></script>
<script src="app.js?v=12"></script>
<script src="fun.js?v=12"></script>
</body>
</html>
